version: '3.8'
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: TechStoreDB
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Casa5599##
      - MSSQL_PID=Developer
    ports:
    # "1436:1433": puerto de tu PC : puerto interno de SQL Server.
      - "1436:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    restart: unless-stopped

volumes:
  sqlserver_data: